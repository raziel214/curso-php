services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_DEBUG: "true"
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: cursophp
      DB_USERNAME: cursophp
      DB_PASSWORD: cursophp
      ADMIN_EMAIL: admin@cursophp.local
      ADMIN_PASSWORD: admin12345
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cursophp
      MYSQL_USER: cursophp
      MYSQL_PASSWORD: cursophp
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
